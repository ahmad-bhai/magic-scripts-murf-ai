<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Murf AI Text-to-Speech Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 30px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 20px;
      color: #38bdf8;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #cbd5e1;
    }

    textarea, select {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
    }

    textarea:focus, select:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #0284c7;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #0369a1;
    }

    .output-card {
      margin-top: 25px;
      padding: 20px;
      background: #0f172a;
      border-radius: 12px;
      display: none;
      text-align: center;
      border: 1px solid #334155;
    }

    audio {
      width: 100%;
      margin-top: 15px;
    }

    .download-btn {
      margin-top: 15px;
      background: #10b981;
      text-decoration: none;
      display: inline-block;
      padding: 10px 20px;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      transition: 0.3s;
    }

    .download-btn:hover {
      background: #059669;
    }

    /* Custom Dialog Box Styling (No Standard Alert) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-card {
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      border: 1px solid #475569;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .modal-card p {
      margin-bottom: 20px;
      font-size: 1.1rem;
      color: #f1f5f9;
    }

    .modal-card button {
      background: #38bdf8;
      color: #0f172a;
      width: auto;
      padding: 8px 25px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎙️ Murf AI Voice Generator</h1>

    <div class="form-group">
      <label for="voiceSelect">Select AI Voice (15 Voices):</label>
      <select id="voiceSelect">
        <option value="Priya" selected>Priya (Desi / Roman Urdu Female)</option>
        <option value="Aarav">Aarav (Desi / Roman Urdu Male)</option>
        <option value="Ananya">Ananya (Hindi Native Female)</option>
        <option value="Kabir">Kabir (Hindi Native Male)</option>
        <option value="Natalie">Natalie (US English Female)</option>
        <option value="Marcus">Marcus (US English Male)</option>
        <option value="Terrell">Terrell (UK Male)</option>
        <option value="Julia">Julia (UK Female)</option>
        <option value="Samantha">Samantha (US Casual Female)</option>
        <option value="Ken">Ken (US Professional Male)</option>
        <option value="Rachel">Rachel (US Soft Female)</option>
        <option value="Miles">Miles (US Deep Male)</option>
        <option value="Finley">Finley (UK Promo Female)</option>
        <option value="George">George (UK Storyteller Male)</option>
        <option value="Aria">Aria (US Energetic Female)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="textInput">Enter Script / Text (Urdu, Hindi, English, Roman Urdu):</label>
      <textarea id="textInput" placeholder="Yahan apna text type karein... (e.g. Assalam-o-Alaikum, kaise hain aap sab?)"></textarea>
    </div>

    <button id="generateBtn" onclick="generateSpeech()">Generate Speech 🚀</button>

    <div class="output-card" id="outputCard">
      <h3>🎉 Generated Audio:</h3>
      <audio id="audioPlayer" controls></audio>
      <br>
      <a id="downloadBtn" class="download-btn" download="murf-voiceover.mp3" target="_blank">Download MP3 📥</a>
    </div>
  </div>

  <!-- Custom Dialog Box -->
  <div class="modal-overlay" id="customModal">
    <div class="modal-card">
      <p id="modalMessage">Notification Message</p>
      <button onclick="closeModal()">OK</button>
    </div>
  </div>

  <script>
    function showModal(msg) {
      document.getElementById('modalMessage').innerText = msg;
      document.getElementById('customModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('customModal').style.display = 'none';
    }

    async function generateSpeech() {
      const text = document.getElementById('textInput').value.trim();
      const voiceId = document.getElementById('voiceSelect').value;
      const btn = document.getElementById('generateBtn');
      const outputCard = document.getElementById('outputCard');
      const audioPlayer = document.getElementById('audioPlayer');
      const downloadBtn = document.getElementById('downloadBtn');

      if (!text) {
        showModal("Baraye meherbani text script dakhil karein!");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Generating Audio... ⏳";
      outputCard.style.display = "none";

      try {
        const response = await fetch('/api', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, voiceId })
        });

        const data = await response.json();

        if (data.success && data.audioUrl) {
          audioPlayer.src = data.audioUrl;
          downloadBtn.href = data.audioUrl;
          outputCard.style.display = "block";
          showModal("✅ Audio kamyabi se generate ho gayi hai!");
        } else {
          showModal("❌ Fail Error: " + (data.error || "Audio generate nahi ho saki."));
        }
      } catch (err) {
        showModal("❌ Server Error: Connection mein masla aaya.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Generate Speech 🚀";
      }
    }
  </script>
</body>
</html>
